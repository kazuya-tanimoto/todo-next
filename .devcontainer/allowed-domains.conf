# この repo 固有の firewall 許可先（init-firewall.sh が起動時に読む）。
# 書式: 1 行 1 ドメイン（A レコードを解決して許可）。
#       `cidr-url <URL>` は CIDR リスト（1 行 1 CIDR）を取得してレンジごと許可。
#       `#` 以降はコメント。
# 注意: ドメイン行は「起動時に解決した IP」だけを許可する方式のため、
#       CDN の IP 回転に弱い。CDN 配下のサービスは可能なら公式 IP レンジ
#       （cidr-url）で許可すること。
# ※ GitHub（api/web/git）・registry.npmjs.org・api.anthropic.com は
#    init-firewall.sh 本体が常に許可するため、ここに書く必要はない。
# ※ 全コンテナ共通の許可先（plugin の MCP 接続先など）は、ここではなく母艦の
#    ~/dotfiles/claude/devcontainer/allowed-domains-common.conf に書く（mount 経由で先に読まれる）。

# Claude Code の Remote Control（bridge）。WebSocket（wss://bridge.claudeusercontent.com）と
# セッション作成 API（/v1/sessions）が同ホスト。未許可だとコンテナ内から Remote Control が
# 繋がらない。CDN 配下のため IP 回転で切れることがある（切れたら ccd 再起動で引き直す）
bridge.claudeusercontent.com

# yarn 4（corepack の yarn 本体取得 + npm ミラー）
registry.yarnpkg.com
repo.yarnpkg.com

# GitHub raw（公式雛形・skill 等の取得。meta の 185.199.108.0/22 にも含まれるが明示追加で担保）
raw.githubusercontent.com

# Playwright ブラウザ再取得（バージョン更新時。初回は firewall 適用前の postCreate で取得）
cdn.playwright.dev
playwright.download.prss.microsoft.com

# 技術記事の参照（本文取得のみ）。zenn.dev は Cloudflare、qiita.com は CloudFront 配下で
# 起動時解決 IP が回転し得る（本ファイル冒頭の注意）。読めなくなったら ccd 再起動で再解決する
zenn.dev
qiita.com

# --- FQDN 連動の動的許可（dnsmasq + ipset）---
# 書式: `dynamic <ドメイン>`。そのドメインとサブドメインを、コンテナ内のプロセスが名前解決した瞬間に
# dnsmasq が回答 IP を ipset allowed-domains に入れる。起動時に dig した IP を固定する方式と違い、
# アプリが引いた IP と firewall が許可した IP が常に一致するので、IP が回る先（Google API 等）はこちらを使う。
#   例: dynamic googleapis.com

